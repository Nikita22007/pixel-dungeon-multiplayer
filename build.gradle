import java.time.Instant
import java.time.LocalDateTime
import java.time.ZoneId
import java.time.format.DateTimeFormatter

buildscript {
    ext.kotlin_version = '1.6.21'
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.3.13'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.1'
    }
}

static def getDate() {
    Instant instant = Instant.now();
    LocalDateTime dateTime = LocalDateTime.ofInstant(instant, ZoneId.of("UTC"));

    // Создаем форматтер с нужным шаблоном
    DateTimeFormatter formatter = DateTimeFormatter.ofPattern("yyyy-MM-dd-HH-mm");

    // Форматируем LocalDateTime в строку
    String formattedDateTime = dateTime.format(formatter);
    return formattedDateTime
}
allprojects {

    ext {
        appName = 'Pixel Dungeon Client'
        appPackageName = 'com.nikita22007.pixeldungeonclient'

        appVersionCode = 74
        if ( gradle.getStartParameter().getTaskRequests().toString().toLowerCase().contains("debug")){
            appVersionName = 'Client-debug'
        }  else {
            appVersionName = 'Client-alpha-'+getDate()
        }
        appAndroidCompileSDK = 28
        appAndroidMinSDK = 16
        appAndroidTargetSDK = 28
    }
    version = appVersionName

    repositories {
        maven { url 'https://jitpack.io'}
        google()
        mavenCentral()
    }
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile).tap {
            configureEach {
                options.compilerArgs << "-Xmaxerrs" << "40000" << "-Xlint"
//<< " -Xmaxwarns" << "1000"
            }
        }
    }
}